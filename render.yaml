services:
  - type: web
    name: finsight-application
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd part2_global_equity && python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
